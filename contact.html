  <style>

    :root {
      --muzzle-flash: #ff6b00;
      --bullet-trail: #ff1a1a;
      --combat-cyan: #00fffc;
      --warzone-bg: #0a0a14;
      --success-glow: #00ff9d;
      --error-glow: #ff3366;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--warzone-bg);
      font-family: 'Electrolize', sans-serif;
      color: white;
      overflow-x: hidden;
      position: relative;
    }

    .rotating-bg {
      position: fixed;
      top: -200px;
      left: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(
        circle,
        var(--bullet-trail),
        transparent 70%
      );
      z-index: 0;
      border-radius: 50%;
      opacity: 0.15;
      pointer-events: none;
    }

    /* ==============================
       MENU
    =============================== */

    .war-menu {
      position: fixed;
      top: 30px;
      right: 30px;
      z-index: 1000;
      cursor: pointer;
      width: 40px;
      height: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: 0.4s;
    }

    .menu-bar {
      height: 3px;
      background: var(--bullet-trail);
      border-radius: 2px;
      transition: 0.4s cubic-bezier(
        0.68,
        -0.55,
        0.265,
        1.55
      );
      box-shadow: 0 0 8px var(--bullet-trail);
    }

    .war-menu.active .menu-bar:nth-child(1) {
      transform: rotate(45deg) translate(8px, 8px);
    }

    .war-menu.active .menu-bar:nth-child(2) {
      opacity: 0;
    }

    .war-menu.active .menu-bar:nth-child(3) {
      transform: rotate(-45deg) translate(8px, -8px);
    }

    .war-menu-content {
      position: fixed;
      top: 90px;
      right: -320px;
      background: rgba(10, 10, 20, 0.98);
      border-radius: 12px;
      padding: 25px;
      width: 280px;
      backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 26, 26, 0.3);
      box-shadow: 0 0 40px rgba(255, 26, 26, 0.2);
      transition: transform 0.5s cubic-bezier(
        0.4,
        0,
        0.2,
        1
      );
      z-index: 999;
    }

    .war-menu-content.active {
      transform: translateX(-360px);
    }

    .menu-item {
      padding: 12px;
      margin: 8px 0;
      position: relative;
      overflow: hidden;
      border-left: 2px solid transparent;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .menu-item::before {
      content: '';
      position: absolute;
      left: -100%;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 26, 26, 0.1);
      transition: left 0.3s ease;
    }

    .menu-item:hover {
      border-left-color: var(--bullet-trail);
    }

    .menu-item:hover::before {
      left: 0;
    }

    .menu-item span {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1em;
      letter-spacing: 1.5px;
      color: var(--combat-cyan);
      position: relative;
      z-index: 1;
    }

    .menu-item a {
      text-decoration: none;
      color: var(--combat-cyan);
    }


    /* ==============================
       HERO
    =============================== */

    .combat-hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .combat-title {
      font-family: 'Russo One', sans-serif;
      font-size: 4.5em;
      text-transform: uppercase;
      background: linear-gradient(
        45deg,
        var(--bullet-trail),
        var(--muzzle-flash)
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px var(--bullet-trail);
      margin-bottom: 20px;
      z-index: 2;
    }

    .combat-tagline {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2em;
      color: var(--combat-cyan);
      letter-spacing: 2px;
      text-shadow: 0 0 20px var(--combat-cyan);
      z-index: 2;
    }

    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }


    /* ==============================
       CONTACT
    =============================== */

    .contact-section {
      padding: 60px 20px;
      max-width: 850px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    .contact-heading {
      text-align: center;
      font-family: 'Russo One', sans-serif;
      font-size: 3em;
      margin-bottom: 30px;
      background: linear-gradient(
        45deg,
        var(--muzzle-flash),
        var(--bullet-trail)
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .contact-info {
      text-align: center;
      margin-bottom: 40px;
      font-size: 1.1em;
      line-height: 1.8;
      color: #ccc;
    }

    .contact-info p {
      margin: 8px 0;
    }

    .contact-info a {
      color: var(--combat-cyan);
      text-decoration: none;
      transition: text-shadow 0.2s, color 0.2s;
    }

    .contact-info a:hover {
      color: #fff;
      text-shadow: 0 0 10px var(--combat-cyan);
    }


    /* ==============================
       FORM
    =============================== */

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 15px;
      border: 1px solid rgba(255, 26, 26, 0.3);
      border-radius: 5px;
      background: rgba(20, 20, 30, 0.9);
      color: #fff;
      font-family: 'Electrolize', sans-serif;
      font-size: 1em;
      outline: none;
      transition: border 0.3s ease, box-shadow 0.2s;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      border-color: var(--combat-cyan);
      box-shadow: 0 0 10px rgba(0, 255, 252, 0.3);
    }

    .contact-form textarea {
      resize: vertical;
      min-height: 140px;
    }

    .contact-form button {
      padding: 15px;
      border: none;
      border-radius: 5px;
      background: var(--bullet-trail);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1em;
      cursor: pointer;
      transition:
        background 0.3s ease,
        transform 0.2s ease,
        box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }

    .contact-form button:hover {
      background: var(--muzzle-flash);
      transform: scale(1.02);
      box-shadow: 0 0 12px rgba(255, 26, 26, 0.6);
    }

    .contact-form button:active {
      transform: scale(0.98);
    }

    .contact-form button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }


    /* ==============================
       STATUS
    =============================== */

    .status-message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-family: 'Orbitron', monospace;
      font-weight: bold;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      transition: all 0.3s;
    }

    .status-success {
      border-left: 5px solid var(--success-glow);
      color: var(--success-glow);
      box-shadow: 0 0 8px rgba(0, 255, 157, 0.3);
    }

    .status-error {
      border-left: 5px solid var(--error-glow);
      color: #ff8aae;
      box-shadow: 0 0 8px rgba(255, 51, 102, 0.3);
    }

    .status-info {
      border-left: 5px solid var(--combat-cyan);
      color: var(--combat-cyan);
    }


    /* ==============================
       MOBILE
    =============================== */

    @media (max-width: 768px) {

      .war-menu {
        top: 20px;
        right: 20px;
      }

      .war-menu-content {
        width: 250px;
        right: -280px;
      }

      .war-menu-content.active {
        transform: translateX(-300px);
      }

      .combat-title {
        font-size: 3em;
        text-align: center;
        padding: 0 20px;
      }

      .combat-tagline {
        font-size: 1em;
        text-align: center;
        padding: 0 20px;
      }

      .contact-heading {
        font-size: 2.5em;
      }

      .contact-info p {
        font-size: 0.95rem;
        word-break: break-word;
      }
    }

    @media (max-width: 480px) {

      .combat-title {
        font-size: 2.4em;
      }

      .combat-tagline {
        font-size: 0.85em;
      }

      .contact-section {
        padding: 50px 15px;
      }

      .contact-heading {
        font-size: 2em;
      }

      .war-menu-content {
        width: 230px;
      }
    }

  </style>

</head>

  <script>

    /* =====================================================
       GSAP
    ====================================================== */

    gsap.registerPlugin(ScrollTrigger);


    /* =====================================================
       PARTICLES
    ====================================================== */

    particlesJS('particles-js', {

      particles: {

        number: {
          value: 80
        },

        color: {
          value: '#ff1a1a'
        },

        shape: {
          type: 'circle'
        },

        opacity: {
          value: 0.7
        },

        size: {
          value: 1.5
        },

        move: {

          enable: true,

          speed: 12,

          direction: 'right',

          straight: true,

          out_mode: 'out',

          trail: {
            enable: true,
            length: 10,
            fillColor: '#000000'
          }

        }

      }

    });


    /* =====================================================
       ROTATING BACKGROUND
    ====================================================== */

    gsap.to(".rotating-bg", {

      rotation: 360,

      duration: 60,

      repeat: -1,

      ease: "linear"

    });


    /* =====================================================
       MENU
    ====================================================== */

    let menuActive = false;


    function toggleMenu() {

      const menu =
        document.querySelector('.war-menu');

      const content =
        document.querySelector('.war-menu-content');


      menuActive = !menuActive;


      menu.classList.toggle(
        'active'
      );


      content.classList.toggle(
        'active'
      );


      if (menuActive) {

        gsap.fromTo(
          '.menu-item',

          {
            x: 100,
            opacity: 0
          },

          {
            x: 0,
            opacity: 1,
            stagger: 0.1,
            duration: 0.5,
            ease: 'power2.out'
          }
        );

      } else {

        gsap.to(
          '.menu-item',

          {
            x: 100,
            opacity: 0,
            stagger: 0.05,
            duration: 0.3,
            ease: 'power2.in'
          }
        );

      }

    }


    /* =====================================================
       CLOSE MENU WHEN CLICKING OUTSIDE
    ====================================================== */

    document.addEventListener(
      'click',
      function(e) {

        const menu =
          document.querySelector(
            '.war-menu'
          );

        const content =
          document.querySelector(
            '.war-menu-content'
          );


        if (
          !menu.contains(e.target) &&
          !content.contains(e.target) &&
          menuActive
        ) {

          toggleMenu();

        }

      }
    );


    /* =====================================================
       HERO ANIMATION
    ====================================================== */

    const heroTL =
      gsap.timeline();


    heroTL

      .from(
        ".combat-title",
        {
          duration: 1.5,
          y: 100,
          opacity: 0,
          ease: "power4.out"
        }
      )

      .from(
        ".combat-tagline",
        {
          duration: 1.2,
          y: 50,
          opacity: 0,
          ease: "power3.out"
        },
        "-=1"
      )

      .to(
        ".combat-title",
        {
          duration: 1,
          scale: 1.05,
          repeat: -1,
          yoyo: true,
          ease: "power1.inOut"
        }
      );


    /* =====================================================
       CONTACT ANIMATION
    ====================================================== */

    gsap.from(
      ".contact-heading",
      {

        scrollTrigger: {
          trigger: ".contact-heading",
          start: "top 80%"
        },

        duration: 1,

        opacity: 0,

        y: 50,

        ease: "power2.out"

      }
    );


    gsap.from(
      ".contact-info p, .contact-form input, .contact-form textarea, .contact-form button",
      {

        scrollTrigger: {
          trigger: ".contact-section",
          start: "top 80%"
        },

        duration: 0.8,

        opacity: 0,

        y: 30,

        stagger: 0.15,

        ease: "power2.out"

      }
    );


    /* =====================================================
       GMAIL CONFIGURATION
    ====================================================== */

    const TARGET_EMAIL =
      "teamhexboys@gmail.com";


    const contactForm =
      document.getElementById(
        "contactForm"
      );


    const statusDiv =
      document.getElementById(
        "formStatus"
      );


    const sendButton =
      document.getElementById(
        "sendBtn"
      );


    /* =====================================================
       STATUS FUNCTION
    ====================================================== */

    function showStatus(
      message,
      type
    ) {

      statusDiv.style.display =
        "block";

      statusDiv.style.opacity =
        "1";

      statusDiv.textContent =
        message;

      statusDiv.className =
        `status-message status-${type}`;

    }


    /* =====================================================
       FORM SUBMIT
    ====================================================== */

    contactForm.addEventListener(
      "submit",
      function(e) {

        e.preventDefault();


        /* -----------------------------------------------
           GET USER DATA
        ------------------------------------------------ */

        const name =
          document
            .getElementById("name")
            .value
            .trim();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const subjectRaw =
          document
            .getElementById("subject")
            .value
            .trim();


        const message =
          document
            .getElementById("message")
            .value
            .trim();


        /* -----------------------------------------------
           VALIDATION
        ------------------------------------------------ */

        if (
          !name ||
          !email ||
          !subjectRaw ||
          !message
        ) {

          showStatus(
            "ERROR: All fields are required. Complete the mission parameters.",
            "error"
          );

          return;

        }


        const emailRegex =
          /^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/i;


        if (
          !emailRegex.test(email)
        ) {

          showStatus(
            "ERROR: Invalid email address. Please enter a valid email.",
            "error"
          );

          return;

        }


        if (
          message.length < 10
        ) {

          showStatus(
            "ERROR: Message too short. Please provide at least 10 characters.",
            "error"
          );

          return;

        }


        /* -----------------------------------------------
           GMAIL SUBJECT
        ------------------------------------------------ */

        const gmailSubject =
          `[TEAM HEX CONTACT] ${subjectRaw}`;


        /* -----------------------------------------------
           GMAIL MESSAGE BODY
        ------------------------------------------------ */

        const gmailBody =

`TEAM HEX CONTACT MESSAGE

========================================

SENDER DETAILS

Full Name:
${name}

Email Address:
${email}

========================================

SUBJECT

${subjectRaw}

========================================

MESSAGE

${message}

========================================

This message was submitted through the official TEAM HEX contact page.

TEAM HEX
Elite Firepower Unit

Website:
https://teamhex.netlify.app/

Facebook:
https://www.facebook.com/share/1BRqtJMLAs/

WhatsApp:
+8801870516299

========================================`;


        /* -----------------------------------------------
           GMAIL COMPOSE URL
        ------------------------------------------------ */

        const gmailURL =
          "https://mail.google.com/mail/?view=cm&fs=1" +
          "&to=" +
          encodeURIComponent(TARGET_EMAIL) +
          "&su=" +
          encodeURIComponent(gmailSubject) +
          "&body=" +
          encodeURIComponent(gmailBody);


        /* -----------------------------------------------
           SHOW STATUS
        ------------------------------------------------ */

        showStatus(
          "Opening Gmail Compose... Your message details are being prepared.",
          "info"
        );


        sendButton.disabled = true;

        sendButton.textContent =
          "OPENING GMAIL...";


        /* -----------------------------------------------
           OPEN GMAIL
        ------------------------------------------------ */

        setTimeout(
          function() {

            const gmailWindow =
              window.open(
                gmailURL,
                "_blank"
              );


            if (!gmailWindow) {

              showStatus(
                "Gmail was blocked by your browser. Please allow pop-ups and try again.",
                "error"
              );

            } else {

              showStatus(
                "Gmail Compose opened. Check the recipient and message, then click SEND.",
                "success"
              );

            }


            sendButton.disabled =
              false;

            sendButton.textContent =
              "SEND SECURE MESSAGE";

          },
          400
        );

      }
    );


    /* =====================================================
       COMBAT EFFECT
    ====================================================== */

    function createCombatEffect() {

      if (!menuActive) {
        return;
      }


      const effect =
        document.createElement('div');


      effect.style.position =
        'fixed';

      effect.style.pointerEvents =
        'none';

      effect.style.zIndex =
        '500';

      effect.style.width =
        '6px';

      effect.style.height =
        '6px';

      effect.style.borderRadius =
        '50%';


      effect.style.background =
        Math.random() > 0.5
          ? '#ff6b00'
          : '#ff1a1a';


      effect.style.left =
        `${Math.random() * 100}vw`;


      effect.style.top =
        `${Math.random() * 100}vh`;


      effect.style.boxShadow =
        '0 0 10px #ff3300';


      document.body.appendChild(
        effect
      );


      gsap.to(
        effect,
        {

          duration: 0.5,

          scale: 2.2,

          opacity: 0,

          ease: "power2.out",

          onComplete: () => {
            effect.remove();
          }

        }
      );

    }


    setInterval(
      () => {

        if (menuActive) {
          createCombatEffect();
        }

      },
      1300
    );

  </script>

</body>
    </html>
