<style>

/* =========================================================
   TEAM HEX — GLOBAL
========================================================= */

:root{
    --red:#ff1a1a;
    --red2:#ff4b18;
    --orange:#ff6b00;
    --cyan:#00fffc;
    --blue:#147cff;
    --black:#000000;
    --dark:#07070d;
    --panel:#0b0b13;
    --white:#ffffff;

    --glow-red:
        0 0 10px rgba(255,26,26,.8),
        0 0 30px rgba(255,26,26,.45),
        0 0 70px rgba(255,26,26,.18);

    --glow-cyan:
        0 0 10px rgba(0,255,252,.8),
        0 0 30px rgba(0,255,252,.35);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#000;
    color:#fff;
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
}

/* =========================================================
   BACKGROUND LIGHT — NO BACKGROUND IMAGE
========================================================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-5;

    background:
        radial-gradient(
            circle at 15% 30%,
            rgba(255,26,26,.12),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 60%,
            rgba(0,255,252,.08),
            transparent 30%
        );

    animation:bgPulse 8s ease-in-out infinite alternate;
}

@keyframes bgPulse{
    from{
        opacity:.65;
    }
    to{
        opacity:1;
    }
}

/* =========================================================
   ROTATING GLOW
========================================================= */

.rotating-bg{
    position:fixed;
    top:-180px;
    left:-180px;
    width:520px;
    height:520px;
    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,26,26,.22),
            transparent 68%
        );

    filter:blur(15px);
    pointer-events:none;
    z-index:-2;
}

/* =========================================================
   MENU
========================================================= */

.war-menu{
    position:fixed;
    top:30px;
    right:30px;

    width:42px;
    height:30px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    cursor:pointer;
    z-index:2000;
}

.menu-bar{
    height:3px;
    width:100%;

    background:var(--red);
    border-radius:3px;

    box-shadow:0 0 10px var(--red);

    transition:.4s cubic-bezier(.68,-.55,.265,1.55);
}

.war-menu.active .menu-bar:nth-child(1){
    transform:rotate(45deg) translate(8px,8px);
}

.war-menu.active .menu-bar:nth-child(2){
    opacity:0;
}

.war-menu.active .menu-bar:nth-child(3){
    transform:rotate(-45deg) translate(8px,-8px);
}

.war-menu-content{
    position:fixed;

    top:90px;
    right:-320px;

    width:280px;

    padding:25px;

    background:rgba(5,5,10,.97);

    border:1px solid rgba(255,26,26,.4);
    border-radius:14px;

    backdrop-filter:blur(25px);

    box-shadow:
        0 0 40px rgba(255,26,26,.2),
        inset 0 0 30px rgba(255,255,255,.015);

    transition:.5s cubic-bezier(.4,0,.2,1);

    z-index:1999;
}

.war-menu-content.active{
    transform:translateX(-360px);
}

.menu-item{
    position:relative;

    padding:13px 12px;
    margin:8px 0;

    overflow:hidden;

    border-left:2px solid transparent;

    cursor:pointer;

    transition:.3s;
}

.menu-item::before{
    content:"";

    position:absolute;
    left:-100%;
    top:0;

    width:100%;
    height:100%;

    background:rgba(255,26,26,.1);

    transition:.3s;
}

.menu-item:hover{
    border-left-color:var(--red);
}

.menu-item:hover::before{
    left:0;
}

.menu-item span{
    position:relative;
    z-index:2;

    font-family:'Orbitron',sans-serif;
    letter-spacing:1.5px;
}

.menu-item a{
    color:var(--cyan);
    text-decoration:none;
}

/* =========================================================
   HERO
========================================================= */

.combat-hero{
    height:50vh;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    position:relative;
    overflow:hidden;
}

#particles-js{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;
}

.combat-title{
    position:relative;
    z-index:2;

    font-family:'Russo One',sans-serif;

    font-size:clamp(3rem,7vw,5.5rem);

    text-transform:uppercase;

    background:
        linear-gradient(
            45deg,
            var(--red),
            var(--orange)
        );

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;

    filter:drop-shadow(0 0 25px rgba(255,26,26,.45));

    letter-spacing:3px;
}

.combat-tagline{
    position:relative;
    z-index:2;

    margin-top:15px;

    color:var(--cyan);

    font-family:'Orbitron',sans-serif;

    font-size:clamp(.8rem,2vw,1.2rem);

    letter-spacing:4px;

    text-shadow:var(--glow-cyan);
}

/* =========================================================
   PLAYER SECTION
   SAME CAROUSEL AREA
========================================================= */

.carousel{
    position:relative;

    width:100%;
    height:800px;

    overflow:hidden;

    margin-top:-50px;

    isolation:isolate;
}

/* Tactical glow */

.carousel::before{
    content:"";

    position:absolute;

    width:600px;
    height:350px;

    left:50%;
    top:45%;

    transform:translate(-50%,-50%);

    background:
        linear-gradient(
            70deg,
            rgba(220,66,42,.25),
            rgba(0,0,255,.14)
        );

    filter:blur(120px);

    border-radius:50%;

    z-index:-2;
}

/* =========================================================
   PLAYER LIST
========================================================= */

.carousel .list{
    position:absolute;

    width:1200px;
    max-width:96%;

    height:680px;

    left:50%;
    top:45px;

    transform:translateX(-50%);
}

/* =========================================================
   PLAYER CARD
========================================================= */

.player-card{
    position:absolute;

    bottom:0;

    width:205px;
    height:600px;

    display:flex;
    align-items:flex-end;
    justify-content:center;

    cursor:pointer;

    transition:
        left .7s cubic-bezier(.2,.8,.2,1),
        transform .7s cubic-bezier(.2,.8,.2,1),
        filter .5s ease,
        opacity .5s ease;

    transform-origin:center bottom;

    z-index:10;
}

/* six positions */

.player-card:nth-child(1){
    left:0;
    transform:translateX(0) scale(.86);
}

.player-card:nth-child(2){
    left:16%;
    transform:translateX(0) scale(.94);
    z-index:20;
}

.player-card:nth-child(3){
    left:32%;
    transform:translateX(0) scale(1);
    z-index:30;
}

.player-card:nth-child(4){
    left:48%;
    transform:translateX(0) scale(1);
    z-index:31;
}

.player-card:nth-child(5){
    left:64%;
    transform:translateX(0) scale(.94);
    z-index:20;
}

.player-card:nth-child(6){
    left:80%;
    transform:translateX(0) scale(.86);
    z-index:10;
}

/* =========================================================
   PLAYER IMAGE
========================================================= */

.player-image-wrap{
    position:relative;

    width:100%;
    height:100%;

    display:flex;
    align-items:flex-end;
    justify-content:center;
}

.player-image-wrap::before{
    content:"";

    position:absolute;

    bottom:25px;

    width:150px;
    height:150px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,26,26,.35),
            transparent 70%
        );

    filter:blur(25px);

    opacity:.55;

    transition:.5s;

    z-index:-1;
}

.player-image{
    position:absolute;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:235px;
    max-width:none;

    height:auto;

    object-fit:contain;

    user-select:none;
    -webkit-user-drag:none;

    filter:
        drop-shadow(0 0 5px rgba(0,0,0,.9))
        drop-shadow(0 0 15px rgba(255,26,26,.18));

    transition:
        transform .65s cubic-bezier(.2,.8,.2,1),
        filter .5s ease,
        opacity .5s ease;
}

/* =========================================================
   NAME PLATE
========================================================= */

.player-name{
    position:absolute;

    bottom:25px;
    left:50%;

    transform:translateX(-50%);

    width:max-content;
    max-width:190px;

    padding:8px 17px;

    background:
        linear-gradient(
            90deg,
            rgba(10,10,18,.96),
            rgba(35,5,8,.96)
        );

    border:1px solid rgba(255,26,26,.65);

    clip-path:
        polygon(
            8px 0,
            100% 0,
            calc(100% - 8px) 100%,
            0 100%
        );

    font-family:'Orbitron',sans-serif;

    font-size:14px;
    font-weight:800;

    letter-spacing:2px;

    color:#fff;

    text-shadow:0 0 8px rgba(255,255,255,.35);

    box-shadow:
        0 0 15px rgba(255,26,26,.2);

    transition:
        transform .4s,
        background .4s,
        border-color .4s,
        box-shadow .4s;

    z-index:50;
}

.player-name::before{
    content:"//";

    color:var(--red);

    margin-right:7px;
}

/* =========================================================
   ROLE — HIDDEN UNTIL HOVER
========================================================= */

.player-role{
    position:absolute;

    bottom:75px;
    left:50%;

    transform:
        translate(-50%,15px)
        scale(.85);

    opacity:0;

    padding:7px 14px;

    border:1px solid rgba(0,255,252,.55);

    background:rgba(0,10,14,.88);

    color:var(--cyan);

    font-family:'Electrolize',sans-serif;

    font-size:12px;
    font-weight:700;

    letter-spacing:2px;

    white-space:nowrap;

    box-shadow:
        0 0 15px rgba(0,255,252,.18);

    transition:
        opacity .35s,
        transform .35s;

    z-index:60;
}

/* =========================================================
   SMALL HEX LABEL
========================================================= */

.player-code{
    position:absolute;

    top:110px;
    left:50%;

    transform:
        translateX(-50%)
        translateY(-10px);

    opacity:0;

    padding:5px 10px;

    background:rgba(255,26,26,.13);

    border:1px solid rgba(255,26,26,.4);

    color:#fff;

    font-family:'Orbitron',sans-serif;

    font-size:9px;

    letter-spacing:1px;

    white-space:nowrap;

    transition:.35s;

    z-index:60;
}

/* =========================================================
   HOVER
========================================================= */

.player-card:hover{
    z-index:100 !important;
    transform:
        translateY(-35px)
        scale(1.08) !important;
}

.player-card:hover .player-image{
    transform:
        translateX(-50%)
        translateY(-10px)
        scale(1.06);

    filter:
        drop-shadow(0 0 8px rgba(255,255,255,.9))
        drop-shadow(0 0 25px rgba(255,26,26,.8))
        drop-shadow(0 0 50px rgba(255,26,26,.35));
}

.player-card:hover .player-name{
    transform:
        translateX(-50%)
        translateY(3px);

    background:
        linear-gradient(
            90deg,
            rgba(255,26,26,.88),
            rgba(100,5,5,.9)
        );

    border-color:#ff5555;

    box-shadow:
        0 0 15px rgba(255,26,26,.8),
        0 0 35px rgba(255,26,26,.3);
}

.player-card:hover .player-role{
    opacity:1;

    transform:
        translate(-50%,0)
        scale(1);
}

.player-card:hover .player-code{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================================================
   WHEN ONE PLAYER IS HOVERED:
   OTHER PLAYERS BECOME BLACK & WHITE
========================================================= */

.player-stage:has(.player-card:hover) .player-card:not(:hover){
    filter:
        grayscale(1)
        brightness(.42)
        contrast(.8);

    opacity:.58;
}

.player-stage:has(.player-card:hover) .player-card:not(:hover) .player-image{
    filter:
        grayscale(1)
        brightness(.45)
        contrast(.85)
        drop-shadow(0 0 3px rgba(255,255,255,.12));
}

.player-stage:has(.player-card:hover) .player-card:not(:hover) .player-name{
    color:#888;

    border-color:rgba(255,255,255,.12);

    box-shadow:none;
}

/* =========================================================
   PLAYER SELECTED / DETAIL MODE
========================================================= */

.player-stage.detail-mode .player-card{
    opacity:.08 !important;
    filter:grayscale(1) blur(2px);

    pointer-events:none;
}

.player-stage.detail-mode .player-card.selected{
    opacity:1 !important;

    filter:none;

    z-index:500;

    left:50%;

    transform:
        translateX(-50%)
        translateY(-150px)
        scale(1.18) !important;

    pointer-events:auto;
}

.player-stage.detail-mode .player-card.selected .player-image{
    transform:
        translateX(-50%)
        scale(1.12);
}

.player-stage.detail-mode .player-card.selected .player-role{
    opacity:1;

    transform:
        translate(-50%,0)
        scale(1);
}

/* =========================================================
   DETAILS BOTTOM
========================================================= */

.player-details{
    position:absolute;

    left:50%;
    bottom:-250px;

    transform:translateX(-50%);

    width:min(850px,90%);

    min-height:190px;

    padding:25px 35px;

    background:
        linear-gradient(
            135deg,
            rgba(10,10,16,.98),
            rgba(25,4,7,.98)
        );

    border:1px solid rgba(255,26,26,.55);

    clip-path:
        polygon(
            20px 0,
            calc(100% - 20px) 0,
            100% 20px,
            100% calc(100% - 20px),
            calc(100% - 20px) 100%,
            20px 100%,
            0 calc(100% - 20px),
            0 20px
        );

    box-shadow:
        0 0 35px rgba(255,26,26,.18),
        inset 0 0 40px rgba(255,26,26,.03);

    opacity:0;

    transition:
        bottom .7s cubic-bezier(.2,.8,.2,1),
        opacity .5s ease;

    z-index:600;
}

.player-stage.detail-mode .player-details{
    bottom:40px;
    opacity:1;
}

.detail-line{
    width:100%;
    height:1px;

    margin:12px 0 18px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--red),
            var(--cyan),
            transparent
        );
}

.details-header{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:20px;
}

.details-name{
    font-family:'Russo One',sans-serif;

    font-size:clamp(1.5rem,4vw,2.5rem);

    color:#fff;

    text-shadow:
        0 0 15px rgba(255,26,26,.5);
}

.details-role{
    padding:7px 14px;

    color:var(--cyan);

    border:1px solid rgba(0,255,252,.4);

    font-family:'Orbitron',sans-serif;

    font-size:11px;

    letter-spacing:2px;

    white-space:nowrap;
}

.details-description{
    color:#aaa;

    font-size:13px;

    line-height:1.7;
}

.detail-close{
    position:absolute;

    top:13px;
    right:18px;

    width:28px;
    height:28px;

    border:1px solid rgba(255,26,26,.4);

    background:rgba(255,26,26,.08);

    color:#fff;

    cursor:pointer;

    font-size:16px;

    transition:.3s;
}

.detail-close:hover{
    background:var(--red);

    box-shadow:var(--glow-red);
}

/* =========================================================
   SEE MORE BUTTON
========================================================= */

.player-see-more{
    position:absolute;

    top:0;
    left:50%;

    transform:
        translateX(-50%)
        translateY(10px);

    opacity:0;

    padding:7px 13px;

    border:1px solid rgba(255,26,26,.55);

    background:rgba(0,0,0,.7);

    color:#fff;

    font-family:'Orbitron',sans-serif;

    font-size:9px;

    letter-spacing:1.5px;

    cursor:pointer;

    transition:.35s;

    z-index:100;
}

.player-card:hover .player-see-more{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

.player-see-more:hover{
    background:var(--red);

    box-shadow:var(--glow-red);
}

/* =========================================================
   TOP TEAM LINE
========================================================= */

.player-stage{
    position:relative;

    width:100%;
    height:100%;
}

.player-stage::before{
    content:"TEAM HEX // ACTIVE ROSTER";

    position:absolute;

    top:0;
    left:50%;

    transform:translateX(-50%);

    font-family:'Orbitron',sans-serif;

    font-size:11px;

    letter-spacing:4px;

    color:rgba(0,255,252,.65);

    white-space:nowrap;

    z-index:200;

    text-shadow:0 0 10px rgba(0,255,252,.3);
}

.player-stage::after{
    content:"";

    position:absolute;

    left:10%;
    right:10%;
    bottom:5px;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,26,26,.7),
            rgba(0,255,252,.7),
            transparent
        );

    box-shadow:
        0 0 12px rgba(255,26,26,.3);

    z-index:2;
}

/* =========================================================
   ARROWS
========================================================= */

.arrows{
    position:absolute;

    bottom:10px;

    left:50%;

    transform:translateX(-50%);

    width:1140px;
    max-width:90%;

    display:flex;

    justify-content:space-between;

    z-index:1000;
}

#prev,
#next{
    width:44px;
    height:44px;

    border-radius:50%;

    border:1px solid rgba(255,26,26,.4);

    background:rgba(10,10,15,.8);

    color:#fff;

    font-size:20px;

    cursor:pointer;

    transition:.3s;

    backdrop-filter:blur(10px);
}

#prev:hover,
#next:hover{
    background:var(--red);

    box-shadow:var(--glow-red);

    transform:scale(1.08);
}

#back{
    position:absolute;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    padding:9px 18px;

    border:1px solid rgba(255,255,255,.15);

    border-bottom:1px solid var(--red);

    background:rgba(0,0,0,.7);

    color:#fff;

    font-family:'Orbitron',sans-serif;

    font-size:10px;

    letter-spacing:3px;

    cursor:pointer;

    transition:.3s;

    z-index:1100;
}

#back:hover{
    background:var(--red);

    box-shadow:var(--glow-red);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:991px){

    .carousel{
        height:700px;
    }

    .carousel .list{
        width:100%;
        max-width:100%;
        height:600px;
    }

    .player-card{
        width:170px;
        height:520px;
    }

    .player-card:nth-child(1){
        left:-3%;
    }

    .player-card:nth-child(2){
        left:14%;
    }

    .player-card:nth-child(3){
        left:31%;
    }

    .player-card:nth-child(4){
        left:48%;
    }

    .player-card:nth-child(5){
        left:65%;
    }

    .player-card:nth-child(6){
        left:82%;
    }

    .player-image{
        width:205px;
    }

    .player-name{
        font-size:10px;
        padding:7px 10px;
    }

    .player-role{
        font-size:9px;
    }

    .player-stage.detail-mode .player-card.selected{
        transform:
            translateX(-50%)
            translateY(-140px)
            scale(1.05) !important;
    }
}

@media(max-width:767px){

    .combat-hero{
        height:42vh;
    }

    .combat-title{
        letter-spacing:1px;
    }

    .combat-tagline{
        letter-spacing:2px;
    }

    .carousel{
        height:720px;
        margin-top:-20px;
    }

    .carousel .list{
        top:30px;
        height:590px;
    }

    /*
       Compact 6-player arrangement
       so everyone remains visible
    */

    .player-card{
        width:125px;
        height:480px;
    }

    .player-card:nth-child(1){
        left:-8%;
        transform:scale(.72);
    }

<!-- =========================================================

<script>

/* =========================================================
   PARTICLES
========================================================= */

if(typeof particlesJS !== "undefined"){

    particlesJS("particles-js",{

        particles:{

            number:{
                value:60
            },

            color:{
                value:"#ff1a1a"
            },

            shape:{
                type:"circle"
            },

            opacity:{
                value:.55
            },

            size:{
                value:1.4
            },

            move:{
                enable:true,
                speed:8,
                direction:"right",
                straight:true,
                out_mode:"out"
            }

        },

        interactivity:{
            detect_on:"canvas",
            events:{
                onhover:{
                    enable:false
                },
                onclick:{
                    enable:false
                },
                resize:true
            }
        },

        retina_detect:true

    });

}


/* =========================================================
   ROTATING GLOW
========================================================= */

gsap.to(".rotating-bg",{

    rotation:360,

    duration:60,

    repeat:-1,

    ease:"linear"

});


/* =========================================================
   MENU
========================================================= */

let menuActive=false;

function toggleMenu(){

    const menu=document.querySelector(".war-menu");
    const content=document.querySelector(".war-menu-content");

    menuActive=!menuActive;

    menu.classList.toggle(
        "active",
        menuActive
    );

    content.classList.toggle(
        "active",
        menuActive
    );

    if(menuActive){

        gsap.fromTo(

            ".menu-item",

            {
                x:100,
                opacity:0
            },

            {
                x:0,
                opacity:1,
                stagger:.08,
                duration:.45,
                ease:"power3.out"
            }

        );

    }else{

        gsap.to(

            ".menu-item",

            {
                x:100,
                opacity:0,
                stagger:.04,
                duration:.25,
                ease:"power2.in"
            }

        );

    }

}


/* =========================================================
   CLOSE MENU OUTSIDE
========================================================= */

document.addEventListener("click",(event)=>{

    const menu=document.querySelector(".war-menu");
    const content=document.querySelector(".war-menu-content");

    if(
        !menu.contains(event.target) &&
        !content.contains(event.target) &&
        menuActive
    ){

        toggleMenu();

    }

});


/* =========================================================
   HERO ANIMATION
========================================================= */

gsap.from(".combat-title",{

    duration:1.5,

    y:100,

    opacity:0,

    filter:"blur(20px)",

    ease:"power4.out"

});

gsap.from(".combat-tagline",{

    duration:1.2,

    y:50,

    opacity:0,

    filter:"blur(10px)",

    delay:.35,

    ease:"power3.out"

});


/* =========================================================
   PLAYER SYSTEM
========================================================= */

const stage=document.getElementById("playerStage");

const cards=[
    ...document.querySelectorAll(".player-card")
];

const detailsName=document.getElementById("detailsName");

const detailsRole=document.getElementById("detailsRole");

const detailsDescription=
    document.getElementById("detailsDescription");

const closeDetails=
    document.getElementById("detailClose");

const backButton=
    document.getElementById("back");


/* =========================================================
   OPEN PLAYER DETAIL
========================================================= */

function openPlayer(card){

    cards.forEach(item=>{
        item.classList.remove("selected");
    });

    card.classList.add("selected");

    detailsName.textContent=
        card.dataset.name;

    detailsRole.textContent=
        card.dataset.role +
        " // " +
        card.dataset.code;

    detailsDescription.textContent=
        card.dataset.description;

    stage.classList.add("detail-mode");

    /* scroll player section into comfortable view */

    setTimeout(()=>{

        stage.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

    },150);

}


/* =========================================================
   CLOSE DETAIL
========================================================= */

function closePlayer(){

    stage.classList.remove(
        "detail-mode"
    );

    cards.forEach(card=>{
        card.classList.remove("selected");
    });

}


/* =========================================================
   CLICK / SEE MORE
========================================================= */

cards.forEach(card=>{

    const seeMore=
        card.querySelector(".player-see-more");

    seeMore.addEventListener(
        "click",
        event=>{

            event.stopPropagation();

            openPlayer(card);

        }
    );


    /*
       Clicking the player itself also selects it
       without opening the large details panel.
    */

    card.addEventListener(
        "click",
        event=>{

            if(
                event.target.closest(
                    ".player-see-more"
                )
            ){
                return;
            }

            if(
                window.innerWidth > 767
            ){

                cards.forEach(item=>{
                    item.classList.remove(
                        "selected"
                    );
                });

            }

        }
    );

});


/* =========================================================
   CLOSE BUTTON
========================================================= */

closeDetails.addEventListener(
    "click",
    closePlayer
);


/* =========================================================
   SEE ALL
========================================================= */

backButton.addEventListener(
    "click",
    closePlayer
);


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(event.key==="Escape"){

            closePlayer();

        }

    }
);


/* =========================================================
   PLAYER ENTRANCE ANIMATION
========================================================= */

gsap.from(".player-card",{

    y:120,

    opacity:0,

    scale:.75,

    duration:1.1,

    stagger:.09,

    delay:.5,

    ease:"power4.out"

});


/* =========================================================
   EXTRA HOVER MICRO ANIMATION
========================================================= */

cards.forEach(card=>{

    card.addEventListener(
        "mouseenter",
        ()=>{

            if(
                stage.classList.contains(
                    "detail-mode"
                )
            ){
                return;
            }

            const image=
                card.querySelector(
                    ".player-image"
                );

            gsap.to(
                image,
                {
                    y:-8,
                    duration:.35,
                    ease:"power2.out"
                }
            );

        }
    );


    card.addEventListener(
        "mouseleave",
        ()=>{

            if(
                stage.classList.contains(
                    "detail-mode"
                )
            ){
                return;
            }

            const image=
                card.querySelector(
                    ".player-image"
                );

            gsap.to(
                image,
                {
                    y:0,
                    duration:.35,
                    ease:"power2.out"
                }
            );

        }
    );

});

</script>
