  <style>
    :root {
      --muzzle-flash: #ff6b00;
      --bullet-trail: #ff1a1a;
      --combat-cyan: #00fffc;
      --warzone-bg: #0a0a14;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: var(--warzone-bg);
      font-family: 'Electrolize', sans-serif;
      color: white;
      overflow-x: hidden;
    }
    /* Navigation */
    .war-menu {
      position: fixed;
      top: 30px;
      right: 30px;
      z-index: 1000;
      cursor: pointer;
      width: 40px;
      height: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: 0.4s;
    }
    .menu-bar {
      height: 3px;
      background: var(--bullet-trail);
      border-radius: 2px;
      transition: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      box-shadow: 0 0 8px var(--bullet-trail);
    }
    .war-menu.active .menu-bar:nth-child(1) {
      transform: rotate(45deg) translate(8px, 8px);
    }
    .war-menu.active .menu-bar:nth-child(2) {
      opacity: 0;
    }
    .war-menu.active .menu-bar:nth-child(3) {
      transform: rotate(-45deg) translate(8px, -8px);
    }
    .war-menu-content {
      position: fixed;
      top: 90px;
      right: -320px;
      background: rgba(10, 10, 20, 0.98);
      border-radius: 12px;
      padding: 25px;
      width: 280px;
      backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 26, 26, 0.3);
      box-shadow: 0 0 40px rgba(255, 26, 26, 0.2);
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 999;
    }
    .war-menu-content.active {
      transform: translateX(-360px);
    }
    .menu-item {
      padding: 12px;
      margin: 8px 0;
      position: relative;
      overflow: hidden;
      border-left: 2px solid transparent;
      transform: translateX(0);
      opacity: 1;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .menu-item::before {
      content: '';
      position: absolute;
      left: -100%;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 26, 26, 0.1);
      transition: left 0.3s ease;
    }
    .menu-item:hover {
      border-left-color: var(--bullet-trail);
    }
    .menu-item:hover::before {
      left: 0;
    }
    .menu-item span {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1em;
      letter-spacing: 1.5px;
      color: var(--combat-cyan);
      position: relative;
      z-index: 1;
    }
    .menu-item a {
      text-decoration: none;
      color: var(--combat-cyan);
    }
    /* Hero Section */
    .combat-hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .combat-title {
      font-family: 'Russo One', sans-serif;
      font-size: 4.5em;
      text-transform: uppercase;
      background: linear-gradient(45deg, var(--bullet-trail), var(--muzzle-flash));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px var(--bullet-trail);
      margin-bottom: 20px;
      z-index: 2;
    }
    .combat-tagline {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2em;
      color: var(--combat-cyan);
      letter-spacing: 2px;
      text-shadow: 0 0 20px var(--combat-cyan);
      z-index: 2;
    }
    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    /* Join Section */
    .join-section {
      padding: 60px 20px;
      max-width: 680px;
      margin: 0 auto;
    }
    .join-heading {
      text-align: center;
      font-family: 'Russo One', sans-serif;
      font-size: 3em;
      margin-bottom: 20px;
      background: linear-gradient(45deg, var(--muzzle-flash), var(--bullet-trail));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .recruit-badge {
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      color: var(--combat-cyan);
      background: rgba(0,255,252,0.1);
      padding: 8px 12px;
      border-radius: 30px;
      font-size: 0.85rem;
      display: inline-block;
      width: auto;
      margin: 0 auto 25px;
      letter-spacing: 1px;
      border: 1px solid rgba(0,255,252,0.3);
    }
    .join-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .join-form input {
      width: 100%;
      padding: 15px;
      border: 1px solid rgba(255, 26, 26, 0.3);
      border-radius: 5px;
      background: rgba(20, 20, 30, 0.9);
      color: #fff;
      font-family: 'Electrolize', sans-serif;
      font-size: 1em;
      outline: none;
      transition: border 0.3s ease;
    }
    .join-form input:focus {
      border-color: var(--combat-cyan);
    }
    .join-form button {
      padding: 15px;
      border: none;
      border-radius: 5px;

    }
    .join-form button:hover {

    }
    .status-message {
      margin-top: 25px;
      padding: 14px 18px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.7);
      border-left: 4px solid var(--combat-cyan);
      font-family: 'Electrolize', sans-serif;
      font-size: 1rem;
      text-align: center;
      color: #ddd;
      backdrop-filter: blur(4px);
      letter-spacing: 0.5px;
    }
    .status-message.info {
      border-left-color: var(--combat-cyan);
      color: var(--combat-cyan);
      background: rgba(0, 255, 252, 0.08);
    }
    .status-message.error {
      border-left-color: var(--bullet-trail);

      background: rgba(255, 26, 26, 0.1);
    }
    /* Mobile Optimization */
    @media (max-width: 768px) {

      }
      .join-heading {
        font-size: 2.5em;
      }
      .recruit-badge {
        font-size: 0.75rem;
      }
    }

<body>
  <!-- Tactical Navigation -->
  <div class="war-menu" onclick="toggleMenu()">
    <div class="menu-bar"></div>

  <!-- Main Combat Zone -->
  <section class="combat-hero">
    <div id="particles-js"></div>
    <h1 class="combat-title">TEAM HEX</h1>
    <p class="combat-tagline">Elite Firepower Unit</p>
  </section>

  <!-- Recruitment Sector: Role replaced with Years section + Player Level detector -->
  <section class="join-section">
    <h2 class="join-heading">JOIN PORTAL</h2>
    <div style="text-align: center;">

    </div>
    <form class="join-form" id="joinForm" novalidate>
      <input type="number" name="uid" id="uid" placeholder="Combatant UID" required>
      <input type="text" name="name" id="name" placeholder="Call Sign / Full Name" required>
      <input type="number" name="playerLevel" id="playerLevel" placeholder="Player Level (numeric)" required>
      <input type="number" name="yearsExp" id="yearsExp" placeholder="Years of Experience (numeric)" required>
      <button type="submit">VERIFY & COMMIT</button>
    </form>
    <div id="applicationStatus" class="status-message" style="display: none;"></div>
  </section>

  <script>
    // ========================
    // TARGET CLAN LINK (DIRECT LINK FROM BRIEF)
    // ========================
    const DIRECT_RECRUIT_LINK = "https://ffshare.garena.com/?region=BD&lang=en&action=locate_clan&clan_id=3062659192&version=OB53";
    
    // Register GSAP plugins
    gsap.registerPlugin(ScrollTrigger);
    
    // Particles Background (combat atmosphere)
    particlesJS('particles-js', {
      particles: {
        number: { value: 80 },
        color: { value: '#ff1a1a' },
        shape: { type: 'circle' },
        opacity: { value: 0.7 },
        size: { value: 1.5 },
        move: {
          enable: true,
          speed: 12,
          direction: 'right',
          straight: true,
          out_mode: 'out',
          trail: {
            enable: true,
            length: 10,
            fillColor: '#000000'
          }
        }
      }
    });
    
    // Navigation Menu Logic
    let menuActive = false;
    function toggleMenu() {
      const menu = document.querySelector('.war-menu');
      const content = document.querySelector('.war-menu-content');
      menuActive = !menuActive;
      
      menu.classList.toggle('active');
      content.classList.toggle('active');
      
      if (menuActive) {
        gsap.fromTo('.menu-item', 
          { x: 100, opacity: 0 },
          { 
            x: 0,
            opacity: 1,
            stagger: 0.1,
            duration: 0.4,
            ease: 'power2.out'
          }
        );
      } else {
        gsap.to('.menu-item', {
          x: 100,
          opacity: 0,
          stagger: 0.05,
          duration: 0.3,
          ease: 'power2.in'
        });
      }
    }
    
    // Close Menu When Clicking Outside
    document.addEventListener('click', (e) => {
      const menu = document.querySelector('.war-menu');
      const content = document.querySelector('.war-menu-content');
      if (!menu.contains(e.target) && !content.contains(e.target)) {
        if (menuActive) {
          toggleMenu();
        }
      }
    });
    
    // Hero animations
    gsap.from('.combat-title', {
      duration: 1.5,
      y: 100,
      opacity: 0,
      ease: 'power4.out'
    });
    gsap.from('.combat-tagline', {
      duration: 1.2,
      y: 50,
      opacity: 0,
      delay: 0.3,
      ease: 'power3.out'
    });
    
    // Optional combat muzzle flash effect (keeps theme)
    setInterval(() => {
      if (menuActive) createCombatEffect();
    }, 700);
    
    function createCombatEffect() {
      const effect = document.createElement('div');
      effect.className = Math.random() > 0.5 ? 'bullet-trail' : 'muzzle-flash';
      if (effect.className === 'bullet-trail') {
        effect.style.position = 'fixed';
        effect.style.top = `${Math.random() * 100}vh`;
        effect.style.left = `${Math.random() * 100}vw`;
        effect.style.width = '8px';
        effect.style.height = '2px';
        effect.style.background = '#ffaa33';
        effect.style.boxShadow = '0 0 8px red';
        effect.style.pointerEvents = 'none';
        effect.style.zIndex = '9999';
        gsap.to(effect, {
          duration: 0.6,
          scaleX: 2.5,
          opacity: 0,
          onComplete: () => effect.remove()
        });
      } else {
        effect.style.position = 'fixed';
        effect.style.left = `${Math.random() * 100}vw`;
        effect.style.top = `${Math.random() * 100}vh`;
        effect.style.width = '12px';
        effect.style.height = '12px';
        effect.style.background = 'radial-gradient(circle, #ff6b00, #ff1a1a)';
        effect.style.borderRadius = '50%';
        effect.style.pointerEvents = 'none';
        effect.style.zIndex = '9999';
        gsap.to(effect, {
          duration: 0.2,
          scale: 1.8,
          opacity: 0,
          onComplete: () => effect.remove()
        });
      }
      document.body.appendChild(effect);
    }
    
    // ===================================================
    // CORE SYSTEM: DETECT LEVEL > 45 AND YEARS > 2
    // Role section fully replaced by Years + Level assessment
    // ===================================================
    const form = document.getElementById('joinForm');
    const statusDiv = document.getElementById('applicationStatus');
    
    // Helper to show status messages (NO EMOJI)
    function showStatus(message, type = 'info') {
      statusDiv.style.display = 'block';
      statusDiv.textContent = message;
      statusDiv.className = `status-message ${type}`;
      // auto fade after 6 seconds? keep readable but not intrusive
      setTimeout(() => {
        if (statusDiv.style.display === 'block') {
          // optional: but we don't remove to keep user informed, just keep visible.
        }
      }, 5000);
    }
    
    function hideStatus() {
      statusDiv.style.display = 'none';
      statusDiv.textContent = '';
    }
    
    // Form submit handler - complete recruitment verification
    form.addEventListener('submit', function(event) {
      event.preventDefault();
      
      // Get form fields
      const uidInput = document.getElementById('uid');
      const nameInput = document.getElementById('name');
      const levelInput = document.getElementById('playerLevel');
      const yearsInput = document.getElementById('yearsExp');
      
      const uid = uidInput.value.trim();
      const name = nameInput.value.trim();
      const playerLevelRaw = levelInput.value.trim();
      const yearsRaw = yearsInput.value.trim();
      
      // Basic empty validation
      if (!uid || !name) {
        showStatus('Error: UID and Name are required. Complete all fields.', 'error');
        return;
      }
      
      if (playerLevelRaw === '' || yearsRaw === '') {
        showStatus('Error: Player Level and Years of Experience must be provided.', 'error');
        return;
      }
      
      const playerLevel = Number(playerLevelRaw);
      const yearsExp = Number(yearsRaw);
      
      // Validate numeric and positive values
      if (isNaN(playerLevel) || isNaN(yearsExp)) {
        showStatus('Invalid input: Player Level and Years must be valid numbers.', 'error');
        return;
      }
      
      if (playerLevel < 0 || yearsExp < 0) {
        showStatus('Invalid input: Please enter positive numeric values only.', 'error');
        return;
      }
      
      // SYSTEM DETECTION CORE:
      // Condition: player level GREATER THAN 45 AND years GREATER THAN 2
      const isEliteRecruit = (playerLevel > 45 && yearsExp > 2);
      
      if (isEliteRecruit) {
        // Recruitment complete -> direct redirect to my link (clan official page)
        // No emoji, instant navigation
        window.location.href = DIRECT_RECRUIT_LINK;
      } else {
        // Condition incomplete: level <=45 OR years <=2 (or both)
        // According to spec: "any condition incomplete you show your application complete / your from is approval"
        // Display approval message, no redirect.
        let failureReason = "";
        if (playerLevel <= 45 && yearsExp <= 2) {
          failureReason = "";
        } else if (playerLevel <= 45) {
          failureReason = "";
        } else if (yearsExp <= 2) {
          failureReason = "";
        }
        
        // Final message: show that application is complete and is pending approval (matches spec)
        const pendingMessage = `Application complete  ${failureReason ? 'Requirement: ' + failureReason : ''} `;
        showStatus(pendingMessage, 'info');
        // Optional: you may also clear the status after some time but we keep visible as feedback
        // Do NOT redirect, stay on page - "your form is approval"
      }
    });
    
    // Additional style to remove any possible emoji from dynamic text
    // ensures dynamic messages completely clear of any unicode emoticons
    const observer = new MutationObserver(() => {
      const statusMsg = document.querySelector('.status-message');
      if (statusMsg && statusMsg.innerText) {
        // sanitize any emoji remnants (though we don't add any)
        let clean = statusMsg.innerText.replace(/[\u{1F600}-\u{1F64F}]/gu, '').replace(/[\u{2700}-\u{27BF}]/gu, '');
        if (clean !== statusMsg.innerText) statusMsg.innerText = clean;
      }
    });
    observer.observe(document.body, { childList: true, subtree: true, characterData: true });
  </script>
