[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/visits"
  to = "/.netlify/functions/visits"
  status = 200
  force = true

# /join and /contact carry working forms (client-side eligibility check,
# prefilled Gmail draft, device-local draft autosave). Rather than duplicate
# that logic onto separate pages, these URLs point at the homepage anchors
# where the forms already live. They are deliberately absent from sitemap.xml.
#
# 302, not 301: browsers cache 301s aggressively, and these two are the most
# likely sections to become real pages later.
[[redirects]]
  from = "/join"
  to = "/#join"
  status = 302

[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 302

# The four content sections are real pages built into dist/ as squad.html etc.
# Netlify's pretty URLs serve /squad from squad.html and redirect
# /squad.html back to /squad, so no rewrite rules are needed here.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Mirrors <meta name="referrer"> in index.html.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # The site uses none of these; declaring it narrows the attack surface.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# ---- Crawler-facing files ----
# Kept short-lived so a changed sitemap or robots.txt is picked up quickly.
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

# Unlike /assets/*, files under /images/ and /icons/ are NOT content-hashed,
# so they must revalidate rather than cache forever — otherwise a swapped
# social-card.jpg or player portrait would never reach returning visitors or
# image crawlers.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# A 404 must never be cached by a CDN across deploys.
[[headers]]
  for = "/404.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/404"
  [headers.values]
    Cache-Control = "no-cache"
