<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — TEAM HEX</title>
    <!--
      Netlify serves this file with a real 404 status, which is what keeps
      mistyped or stale URLs out of the index instead of registering as
      soft 404s. `noindex, follow` passes any link equity back to the site.
    -->
    <!--
      No canonical here on purpose: pointing a 404 at the homepage sends a
      conflicting signal. `noindex` alone is the correct treatment. This file
      is copied verbatim from public/, so unlike index.html it must not use the
      site-URL build token — nothing would substitute it.
    -->
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#05070c" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      /* Self-contained on purpose: this page must render even when the hashed
         app bundle is missing or a deploy is mid-flight. */
      :root {
        --ink: #05070c;
        --ice: #7fd4ff;
        --bone: #e8edf5;
        --muted: #8b98ab;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(120% 90% at 50% 0%, #0d1626 0%, var(--ink) 60%),
          var(--ink);
        color: var(--bone);
        font-family: "Inter", "Barlow Condensed", system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 34rem; text-align: center; }
      .code {
        margin: 0;
        font-size: clamp(4rem, 18vw, 8rem);
        line-height: .9;
        font-weight: 800;
        letter-spacing: -.04em;
        color: transparent;
        -webkit-text-stroke: 2px rgba(127, 212, 255, .55);
      }
      .eyebrow {
        margin: 1.25rem 0 .5rem;
        font-size: .72rem;
        letter-spacing: .28em;
        text-transform: uppercase;
        color: var(--ice);
      }
      h1 {
        margin: 0 0 .75rem;
        font-size: clamp(1.4rem, 4.5vw, 2.1rem);
        line-height: 1.15;
        text-transform: uppercase;
        letter-spacing: .01em;
      }
      p { margin: 0 auto 2rem; max-width: 28rem; color: var(--muted); line-height: 1.65; font-size: .95rem; }
      a.button {
        display: inline-flex;
        align-items: center;
        gap: .5rem;
        padding: .85rem 1.5rem;
        border: 1px solid rgba(127, 212, 255, .4);
        border-radius: 2px;
        background: rgba(127, 212, 255, .08);
        color: var(--bone);
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: .16em;
        font-size: .78rem;
        font-weight: 700;
        transition: background .2s ease, border-color .2s ease;
      }
      a.button:hover, a.button:focus-visible {
        background: rgba(127, 212, 255, .18);
        border-color: var(--ice);
      }
      a.button:focus-visible { outline: 2px solid var(--ice); outline-offset: 3px; }
      nav { margin-top: 2.25rem; display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; justify-content: center; }
      nav a { color: var(--muted); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; }
      nav a:hover, nav a:focus-visible { color: var(--ice); }
      @media (prefers-reduced-motion: no-preference) {
        .code { animation: drift 6s ease-in-out infinite alternate; }
        @keyframes drift { to { -webkit-text-stroke-color: rgba(127, 212, 255, .9); } }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <p class="eyebrow">Signal lost</p>
      <h1>This page is not in the archive.</h1>
      <p>
        The link may be out of date or mistyped. The unit is still assembled — head back to the
        roster, the match films, or the recruitment portal.
      </p>
      <a class="button" href="/">Return to TEAM HEX</a>
      <nav aria-label="Popular sections">
        <a href="/#squad">The squad</a>
        <a href="/#about">Our story</a>
        <a href="/#highlights">Highlights</a>
        <a href="/#join">Join the unit</a>
        <a href="/#contact">Contact</a>
      </nav>
    </main>
  </body>
</html>
