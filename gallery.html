<html lang="en">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Russo+One&family=Electrolize&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
  <style>
    :root {
      --muzzle-flash: #ff6b00;
      --bullet-trail: #ff1a1a;
      --combat-cyan: #00fffc;
      --warzone-bg: #0a0a14;
      --dark-card: rgba(15, 15, 25, 0.85);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: var(--warzone-bg);
      font-family: 'Electrolize', sans-serif;
      color: white;
      overflow-x: hidden;
    }
    /* Navigation */
    .war-menu {
      position: fixed;
      top: 30px;
      right: 30px;
      z-index: 1000;
      cursor: pointer;
      width: 40px;
      height: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: 0.4s;
    }
    .menu-bar {
      height: 3px;
      background: var(--bullet-trail);
      border-radius: 2px;
      transition: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      box-shadow: 0 0 8px var(--bullet-trail);
    }
    .war-menu.active .menu-bar:nth-child(1) {
      transform: rotate(45deg) translate(8px, 8px);
    }
    .war-menu.active .menu-bar:nth-child(2) {
      opacity: 0;
    }
    .war-menu.active .menu-bar:nth-child(3) {
      transform: rotate(-45deg) translate(8px, -8px);
    }
    .war-menu-content {
      position: fixed;
      top: 90px;
      right: -320px;
      background: rgba(10, 10, 20, 0.98);
      border-radius: 12px;
      padding: 25px;
      width: 280px;
      backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 26, 26, 0.3);
      box-shadow: 0 0 40px rgba(255, 26, 26, 0.2);
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 999;
    }
    .war-menu-content.active {
      transform: translateX(-360px);
    }
    .menu-item {
      padding: 12px;
      margin: 8px 0;
      position: relative;
      overflow: hidden;
      border-left: 2px solid transparent;
      transform: translateX(0);
      opacity: 1;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .menu-item::before {
      content: '';
      position: absolute;
      left: -100%;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 26, 26, 0.1);
      transition: left 0.3s ease;
    }
    .menu-item:hover {
      border-left-color: var(--bullet-trail);
    }
    .menu-item:hover::before {
      left: 0;
    }
    .menu-item span {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1em;
      letter-spacing: 1.5px;
      color: var(--combat-cyan);
      position: relative;
      z-index: 1;
    }
    .menu-item a {
      text-decoration: none;
      color: var(--combat-cyan);
    }
    /* Hero Section */
    .combat-hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .combat-title {
      font-family: 'Russo One', sans-serif;
      font-size: 4.5em;
      text-transform: uppercase;
      background: linear-gradient(45deg, var(--bullet-trail), var(--muzzle-flash));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px var(--bullet-trail);
      margin-bottom: 20px;
      z-index: 2;
    }
    .combat-tagline {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2em;
      color: var(--combat-cyan);
      letter-spacing: 2px;
      text-shadow: 0 0 20px var(--combat-cyan);
      z-index: 2;
    }
    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    /* Gallery Section */
    .gallery-section {
      padding: 60px 20px;
      max-width: 1300px;
      margin: 0 auto;
    }
    .gallery-heading {
      text-align: center;
      font-family: 'Russo One', sans-serif;
      font-size: 3em;
      margin-bottom: 15px;
      background: linear-gradient(45deg, var(--muzzle-flash), var(--bullet-trail));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gallery-sub {
      text-align: center;
      color: var(--combat-cyan);
      margin-bottom: 40px;
      font-size: 1.1rem;
      letter-spacing: 1px;
      border-bottom: 1px dashed rgba(0,255,252,0.3);
      display: inline-block;
      width: auto;
      margin-left: auto;
      margin-right: auto;
      padding-bottom: 8px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 28px;
    }
    .gallery-item {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
      overflow: hidden;
      border: 2px solid rgba(255, 26, 26, 0.4);
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(255, 26, 26, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      position: relative;
    }
    .gallery-item:hover {
      transform: scale(1.03);
      box-shadow: 0 0 28px rgba(255, 26, 26, 0.6);
      border-color: var(--combat-cyan);
    }
    .gallery-item img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      transition: 0.3s;
      cursor: zoom-in;
    }
    .gallery-item iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
      display: block;
      background: #000;
      pointer-events: auto;
    }
    .bullet-trail {
      position: fixed;
      width: 12px;
      height: 3px;
      background: linear-gradient(90deg, #ff3300, #ffaa33);
      filter: blur(1px);
      box-shadow: 0 0 12px #ff5500;
      z-index: 9999;
      pointer-events: none;
      border-radius: 2px;
    }
    .muzzle-flash {
      position: fixed;
      width: 18px;
      height: 18px;
      background: radial-gradient(circle, #ffcc00, #ff3300);
      border-radius: 50%;
      filter: blur(3px);
      z-index: 9999;
      pointer-events: none;
      opacity: 0.9;
    }
    .vid-label {
      position: absolute;
      bottom: 8px;
      left: 12px;
      background: rgba(0,0,0,0.7);
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 20px;
      font-family: 'Orbitron', monospace;
      color: var(--combat-cyan);
      backdrop-filter: blur(4px);
      pointer-events: none;
      z-index: 3;
    }
    @media (max-width: 768px) {
      .war-menu { top: 20px; right: 20px; }
      .war-menu-content { width: 250px; right: -280px; }
      .war-menu-content.active { transform: translateX(-300px); }
      .combat-title { font-size: 3em; text-align: center; padding: 0 20px; }
      .combat-tagline { font-size: 1em; text-align: center; padding: 0 20px; }
      .gallery-heading { font-size: 2.5em; }
      .gallery-grid { gap: 20px; }
      .gallery-item iframe { aspect-ratio: 16 / 9; }
      .gallery-item img { height: 180px; }
    }

    /* ========== LIGHTBOX ZOOM SYSTEM (TACTICAL OVERLAY) ========== */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(12px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: 'Orbitron', monospace;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox-container {
      width: 90vw;
      height: 85vh;
      background: rgba(5, 5, 10, 0.7);
      border-radius: 20px;
      border: 1px solid rgba(255, 26, 26, 0.6);
      box-shadow: 0 0 30px rgba(255, 26, 26, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .lightbox-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.7);
      border-bottom: 1px solid rgba(255, 26, 26, 0.4);
      flex-wrap: wrap;
      gap: 10px;
    }
    .ctrl-btn {
      background: none;
      border: 1px solid var(--bullet-trail);
      color: var(--combat-cyan);
      font-size: 1.2rem;
      font-family: 'Orbitron', monospace;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
    }
    .ctrl-btn:hover {
      background: var(--bullet-trail);
      color: black;
      border-color: white;
      box-shadow: 0 0 12px var(--bullet-trail);
    }
    .zoom-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .zoom-level {
      background: #111;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--combat-cyan);
      border: 1px solid var(--combat-cyan);
    }
    .nav-group {
      display: flex;
      gap: 12px;
    }
    .lightbox-image-wrapper {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: #030308;
      scroll-behavior: smooth;
    }
    .lightbox-img {
      display: block;
      transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: grab;
      user-select: none;
      transform-origin: center center;
    }
    .lightbox-img:active {
      cursor: grabbing;
    }
    .close-lightbox {
      position: absolute;
      top: 16px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      border: none;
      color: white;
      font-size: 32px;
      line-height: 1;
      cursor: pointer;
      z-index: 2100;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      transition: 0.2s;
      border: 1px solid var(--bullet-trail);
    }
    .close-lightbox:hover {
      background: var(--bullet-trail);
      transform: scale(1.1);
      color: black;
    }
    .lightbox-caption {
      text-align: center;
      padding: 8px;
      font-size: 0.8rem;
      color: var(--combat-cyan);
      background: rgba(0,0,0,0.6);
      border-top: 1px solid rgba(255, 26, 26, 0.4);
    }
    @media (max-width: 680px) {
      .lightbox-controls { padding: 8px 12px; }
      .ctrl-btn { padding: 4px 8px; font-size: 0.8rem; }
      .zoom-level { font-size: 0.7rem; }
      .close-lightbox { top: 8px; right: 12px; width: 36px; height: 36px; font-size: 26px; }
      .lightbox-container { width: 95vw; height: 80vh; }
    }
  </style>
</head>

  <script>
    // ======================== PHOTO ZOOM SYSTEM (LIGHTBOX) ========================
    (function() {
      // Collect all photo images (exclude video items)
      const galleryImages = Array.from(document.querySelectorAll('.gallery-item img'));
      const imageItems = galleryImages.map(img => ({
        src: img.src,
        alt: img.alt || 'Combat photo'
      }));
      
      let currentIndex = 0;
      let currentZoom = 1;
      let lightboxActive = false;
      
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      const captionEl = document.getElementById('lightboxCaption');
      const zoomLevelSpan = document.getElementById('zoomLevel');
      const wrapperDiv = document.getElementById('lightboxWrapper');
      
      // Helper: update zoom display & transform
      function applyZoom() {
        if (!lightboxImg) return;
        lightboxImg.style.transform = `scale(${currentZoom})`;
        zoomLevelSpan.innerText = `${Math.round(currentZoom * 100)}%`;
      }
      
      function resetZoom() {
        currentZoom = 1;
        applyZoom();
        // optional: reset scroll position to center
        if (wrapperDiv) {
          wrapperDiv.scrollLeft = (wrapperDiv.scrollWidth - wrapperDiv.clientWidth) / 2;
          wrapperDiv.scrollTop = (wrapperDiv.scrollHeight - wrapperDiv.clientHeight) / 2;
        }
      }
      
      function zoomIn() {
        let newZoom = currentZoom + 0.25;
        if (newZoom > 4) newZoom = 4;
        currentZoom = newZoom;
        applyZoom();
      }
      
      function zoomOut() {
        let newZoom = currentZoom - 0.25;
        if (newZoom < 0.5) newZoom = 0.5;
        currentZoom = newZoom;
        applyZoom();
      }
      
      function loadImage(index) {
        if (!imageItems.length) return;
        const item = imageItems[index];
        lightboxImg.src = item.src;
        lightboxImg.alt = item.alt;
        captionEl.innerHTML = `📸 ${item.alt} | TEAM HEX ARCHIVE`;
        // Reset zoom on new image
        currentZoom = 1;
        applyZoom();
        // reset scroll position
        if (wrapperDiv) {
          wrapperDiv.scrollTop = 0;
          wrapperDiv.scrollLeft = 0;
        }
      }
      
      function openLightbox(startIndex) {
        if (!imageItems.length) return;
        currentIndex = startIndex;
        loadImage(currentIndex);
        lightbox.classList.add('active');
        lightboxActive = true;
        document.body.style.overflow = 'hidden';
      }
      
      function closeLightbox() {
        lightbox.classList.remove('active');
        lightboxActive = false;
        document.body.style.overflow = '';
        currentZoom = 1;
        applyZoom(); // reset style for next open
      }
      
      function nextImage() {
        if (!imageItems.length) return;
        currentIndex = (currentIndex + 1) % imageItems.length;
        loadImage(currentIndex);
      }
      
      function prevImage() {
        if (!imageItems.length) return;
        currentIndex = (currentIndex - 1 + imageItems.length) % imageItems.length;
        loadImage(currentIndex);
      }
      
      // Add click listeners to all gallery images
      galleryImages.forEach((img, idx) => {
        img.addEventListener('click', (e) => {
          e.stopPropagation();
          openLightbox(idx);
        });
      });
      
      // Buttons events
      const prevBtn = document.getElementById('prevImageBtn');
      const nextBtn = document.getElementById('nextImageBtn');
      const zoomInBtn = document.getElementById('zoomInBtn');
      const zoomOutBtn = document.getElementById('zoomOutBtn');
      const resetZoomBtn = document.getElementById('resetZoomBtn');
      const closeBtn = document.getElementById('closeLightboxBtn');
      
      if (prevBtn) prevBtn.addEventListener('click', prevImage);
      if (nextBtn) nextBtn.addEventListener('click', nextImage);
      if (zoomInBtn) zoomInBtn.addEventListener('click', zoomIn);
      if (zoomOutBtn) zoomOutBtn.addEventListener('click', zoomOut);
      if (resetZoomBtn) resetZoomBtn.addEventListener('click', resetZoom);
      if (closeBtn) closeBtn.addEventListener('click', closeLightbox);
      
      // Click on background overlay (lightbox backdrop) closes
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
      });
      
      // Keyboard navigation
      document.addEventListener('keydown', (e) => {
        if (!lightboxActive) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') prevImage();
        if (e.key === 'ArrowRight') nextImage();
        if (e.key === '+' || e.key === '=') { zoomIn(); e.preventDefault(); }
        if (e.key === '-' || e.key === '_') { zoomOut(); e.preventDefault(); }
        if (e.key === '0') { resetZoom(); e.preventDefault(); }
      });
      
      // Mouse wheel zoom on wrapper (while lightbox open)
      wrapperDiv.addEventListener('wheel', (e) => {
        if (!lightboxActive) return;
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.1 : 0.1;
        let newZoom = currentZoom + delta;
        if (newZoom > 4) newZoom = 4;
        if (newZoom < 0.5) newZoom = 0.5;
        currentZoom = newZoom;
        applyZoom();
      }, { passive: false });
      
      // touch-friendly: optional double-click to reset zoom
      lightboxImg.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        resetZoom();
      });
      
      console.log("[TEAM HEX] Tactical Photo Zoom System armed. Images ready:", imageItems.length);
    })();
    
    // Existing scripts: Particles, Menu, GSAP, Combat FX
    gsap.registerPlugin(ScrollTrigger);
    particlesJS('particles-js', {
      particles: {
        number: { value: 95 },
        color: { value: '#ff3a3a' },
        shape: { type: 'circle' },
        opacity: { value: 0.6, random: true },
        size: { value: 1.8, random: true },
        move: {
          enable: true,
          speed: 14,
          direction: 'right',
          straight: true,
          out_mode: 'out',
          trail: { enable: true, length: 8, fillColor: '#0a0a14' }
        },
        line_linked: { enable: false }
      },
      interactivity: {
        detect_on: 'canvas',
        events: { onhover: { enable: false }, onclick: { enable: false } }
      }
    });
    
    let menuActive = false;
    function toggleMenu() {
      const menu = document.querySelector('.war-menu');
      const content = document.querySelector('.war-menu-content');
      menuActive = !menuActive;
      menu.classList.toggle('active');
      content.classList.toggle('active');
      if(menuActive) {
        gsap.fromTo('.menu-item',
          { x: 100, opacity: 0 },
          { x: 0, opacity: 1, stagger: 0.08, duration: 0.4, ease: 'back.out(0.7)' }
        );
      } else {
        gsap.to('.menu-item', { x: 100, opacity: 0, stagger: 0.05, duration: 0.25, ease: 'power2.in' });
      }
    }
    document.addEventListener('click', (e) => {
      const menu = document.querySelector('.war-menu');
      const content = document.querySelector('.war-menu-content');
      if(menu && content && !menu.contains(e.target) && !content.contains(e.target) && menuActive) toggleMenu();
    });
    
    gsap.from('.combat-title', { duration: 1.4, y: 120, opacity: 0, scale: 0.9, ease: 'elastic.out(1, 0.5)' });
    gsap.from('.combat-tagline', { duration: 1.2, y: 50, opacity: 0, delay: 0.3, ease: 'power3.out' });
    gsap.from('.gallery-item', {
      scrollTrigger: { trigger: '.gallery-section', start: 'top 80%', toggleActions: 'play none none reverse' },
      opacity: 0, y: 60, duration: 0.8, stagger: 0.1, ease: 'power2.out'
    });
    
    let fxInterval;
    function createCombatEffect() {
      const effect = document.createElement('div');
      const rand = Math.random();
      if(rand > 0.55) {
        effect.className = 'bullet-trail';
        effect.style.top = `${Math.random() * window.innerHeight}px`;
        effect.style.left = `${Math.random() * window.innerWidth}px`;
        effect.style.transform = `rotate(${Math.random() * 360}deg)`;
        document.body.appendChild(effect);
        gsap.to(effect, { duration: 0.5, x: (Math.random() - 0.5) * 200 + (Math.random() > 0.5 ? 150 : -150), opacity: 0, scaleX: 2.8, ease: 'power2.out', onComplete: () => effect.remove() });
      } else {
        effect.className = 'muzzle-flash';
        effect.style.left = `${Math.random() * window.innerWidth}px`;
        effect.style.top = `${Math.random() * window.innerHeight}px`;
        document.body.appendChild(effect);
        gsap.to(effect, { duration: 0.25, scale: 2.2, opacity: 0, ease: 'back.out(1.2)', onComplete: () => effect.remove() });
      }
    }
    function startCombatEffects() { if(fxInterval) clearInterval(fxInterval); fxInterval = setInterval(() => { if(menuActive) createCombatEffect(); }, 700); }
    startCombatEffects();
    
    window.addEventListener('scroll', () => {
      const hero = document.querySelector('.combat-hero');
      if(hero) {
        const scrollVal = window.scrollY;
        gsap.to('.combat-title', { duration: 0.2, y: scrollVal * 0.15, overwrite: true, ease: 'none' });
        gsap.to('.combat-tagline', { duration: 0.2, y: scrollVal * 0.08, overwrite: true });
      }
    });
  </script>
</body>
  </html>
